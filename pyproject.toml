[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "upcp-plc"
version = "0.1.0"
description = "UPCP: a unified Python API for industrial controller communication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "UPCP Contributors"}]
keywords = ["plc", "industrial", "modbus", "automation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: System :: Networking"]

[project.optional-dependencies]
s7 = ["python-snap7>=1.3,<4"]
eip = ["pycomm3>=1.2,<2"]
ads = ["pyads>=3.4,<5"]
opcua = ["opcua>=0.98,<1"]
mc = ["pymcprotocol>=0.3,<1"]
fins = ["fins-driver>=0.3.1,<1"]
all = ["python-snap7>=1.3,<4", "pycomm3>=1.2,<2", "pyads>=3.4,<5", "opcua>=0.98,<1", "pymcprotocol>=0.3,<1", "fins-driver>=0.3.1,<1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/upcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
